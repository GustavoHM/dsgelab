name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build once; every test job installs what a user would download.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # The suite against the installed wheel, not the checkout: DSGELAB_TEST_INSTALLED
  # stops tests/conftest.py from putting src/ on the path, so a module or data file
  # missing from the wheel fails here.
  wheel:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      DSGELAB_TEST_INSTALLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install the wheel
        shell: bash
        run: python -m pip install "$(ls dist/*.whl)[symbolic,test]"
      - run: python -m pytest -q

  # The Heutel port's algebra is translated from Heutel's files on the user's machine;
  # here it is fetched from the public copy, so the port's tests run.
  heutel:
    needs: build
    runs-on: ubuntu-latest
    env:
      DSGELAB_TEST_INSTALLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: python -m pip install "$(ls dist/*.whl)[test]"
      - run: python -c "from dsgelab.examples import heutel; heutel.fetch()"
      - run: python -m pytest -q tests/test_heutel.py -rs

  # The sdist must carry what its own tests need.
  sdist:
    needs: build
    runs-on: ubuntu-latest
    env:
      DSGELAB_TEST_INSTALLED: "1"
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install from the sdist and test from its tree
        run: |
          mkdir sdist && tar -xzf dist/*.tar.gz -C sdist --strip-components=1
          python -m pip install "./sdist[symbolic,test]"
          cd sdist && python -m pytest -q

  # Every code block on the site has to run.
  site:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: python -m pip install "$(ls dist/*.whl)[symbolic]"
      - run: python tools/check_site_examples.py

  # The development install the README describes.
  editable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[symbolic,test]"
      - run: python -m pytest -q
