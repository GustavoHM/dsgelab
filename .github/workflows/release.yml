name: release

# Publishes to TestPyPI and then to PyPI when a tag vX.Y.Z is pushed, by trusted
# publishing: no token is stored in the repository. Set-up, once per index
# (test.pypi.org and pypi.org): Account > Publishing > add a pending publisher
# with owner GustavoHM, repository dsgelab, workflow release.yml, and the
# environment named below (testpypi, pypi). In the repository settings, create
# the two environments; giving pypi a required reviewer makes the final upload
# wait for a click after TestPyPI has succeeded.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: The tag must match the version in pyproject.toml
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, pyproject $version"; exit 1; }
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/dsgelab
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  # Install what TestPyPI now serves, with dependencies from PyPI, and run the
  # suite against it before the real upload.
  check-testpypi:
    needs: testpypi
    runs-on: ubuntu-latest
    env:
      DSGELAB_TEST_INSTALLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install from TestPyPI
        run: |
          version="${GITHUB_REF_NAME#v}"
          # TestPyPI can take minutes to list a new upload (0.7.0 took more than three). pip would
          # reuse the index page it cached on the first try, so --no-cache-dir makes every try,
          # for up to 15 minutes, read the page again.
          for i in $(seq 1 30); do
            python -m pip install --no-cache-dir --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ "dsgelab[symbolic,test]==$version" && break
            sleep 30
          done
          python -c "import dsgelab; assert dsgelab.__version__ == '$version'"
      - run: python -m pytest -q

  pypi:
    needs: check-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dsgelab
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2
