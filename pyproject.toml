[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dsgelab"
version = "0.5.0"
description = "Solve, simulate and estimate DSGE models in Python: perturbation to third order, perfect foresight, OccBin, optimal policy, Bayesian estimation and Dynare .mod import, validated against Dynare."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Gustavo Hoffmann Moreira", email = "gustavo@gakusai.net"}]
keywords = ["dsge", "perturbation", "rational expectations", "klein", "macroeconomics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Science/Research",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/GustavoHM/dsgelab"
Documentation = "https://github.com/GustavoHM/dsgelab/tree/main/docs"
Repository = "https://github.com/GustavoHM/dsgelab"
Issues = "https://github.com/GustavoHM/dsgelab/issues"

[project.optional-dependencies]
symbolic = ["sympy>=1.12"]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7"]

[project.scripts]
dsgelab = "dsgelab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dsgelab = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib import mode lets both packages be tested in one run: the
# default mode keys modules by basename and two suites with a
# test_calibrate.py would collide.
addopts = "--import-mode=importlib"
